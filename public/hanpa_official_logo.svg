<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <defs>
    <linearGradient id="beltBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2C5A" />
      <stop offset="100%" stop-color="#091E3E" />
    </linearGradient>
    <linearGradient id="goldTab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#C28722" />
    </linearGradient>
    <linearGradient id="rollerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9AA3AE" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <!-- Left Conveyor Belt Loop Graphic -->
  <g id="conveyor-loop" transform="translate(10, 10)">
    <!-- Top outer gold tab -->
    <polygon points="120,20 180,20 160,50 100,50" fill="url(#goldTab)" />
    
    <!-- Bottom outer gold tab -->
    <polygon points="110,165 210,165 190,195 90,195" fill="url(#goldTab)" />

    <!-- Main Outer Navy Belt Loop -->
    <path d="M 120,20 C 50,20 20,60 20,110 C 20,165 60,195 125,195 L 180,195 L 160,165 L 125,165 C 80,165 52,140 52,110 C 52,75 80,50 120,50 Z" fill="url(#beltBlue)" />

    <!-- Inner Conveyor Track / Rollers -->
    <!-- Curved inner track with slats -->
    <path d="M 115,58 C 75,58 58,80 58,110 C 58,135 78,145 110,145 L 135,145 C 145,145 155,135 155,125 C 155,115 145,105 130,105 L 105,105 C 85,105 75,95 75,85 C 75,70 90,58 115,58 Z" fill="#334155" />

    <!-- Mechanical roller slats -->
    <g fill="#CBD5E1" stroke="#1E293B" stroke-width="1.5">
      <rect x="80" y="66" width="6" height="18" rx="2" transform="rotate(-35 80 66)" />
      <rect x="68" y="86" width="6" height="18" rx="2" transform="rotate(-15 68 86)" />
      <rect x="66" y="110" width="6" height="18" rx="2" transform="rotate(10 66 110)" />
      <rect x="74" y="130" width="6" height="18" rx="2" transform="rotate(35 74 130)" />
      <rect x="94" y="140" width="6" height="18" rx="2" transform="rotate(60 94 140)" />
      <rect x="116" y="140" width="6" height="18" rx="2" transform="rotate(85 116 140)" />
    </g>

    <!-- Lower 3D cylindrical roller / drum block -->
    <path d="M 85,105 L 135,105 C 148,105 158,113 158,122 L 158,142 C 158,152 148,158 135,158 L 85,158 C 72,158 62,152 62,142 L 62,122 C 62,113 72,105 85,105 Z" fill="url(#rollerGrad)" stroke="#475569" stroke-width="1" />
    
    <!-- Vertical roller segments on the drum -->
    <line x1="80" y1="106" x2="80" y2="157" stroke="#475569" stroke-width="2" />
    <line x1="95" y1="105" x2="95" y2="158" stroke="#334155" stroke-width="2" />
    <line x1="110" y1="105" x2="110" y2="158" stroke="#475569" stroke-width="2" />
    <line x1="125" y1="105" x2="125" y2="158" stroke="#334155" stroke-width="2" />
    <line x1="140" y1="106" x2="140" y2="157" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Right Typography: "HanPa" -->
  <text x="235" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="118" font-weight="900" fill="#0B234B" letter-spacing="-2px">
    HanPa
  </text>
</svg>
